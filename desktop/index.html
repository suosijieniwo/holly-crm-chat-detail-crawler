<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>客服聊天记录导出工具</title>
  <link rel="stylesheet" href="styles.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <header class="titlebar">
    <div class="titlebar-content">
      <div class="brand">
        <img src="assets/mark.svg" width="24" height="24" alt="">
        <h1>客服聊天记录导出工具</h1>
      </div>
      <button class="button quiet" id="settings-button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4M9 16v4"/></svg>
        设置
      </button>
    </div>
    <div class="settings-caption-marks" id="settings-caption-marks" aria-hidden="true" hidden>
      <svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg>
      <svg id="settings-maximize-mark" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="1"/></svg>
      <svg id="settings-restore-mark" viewBox="0 0 12 12" hidden><path d="M4 3V1h7v7H9"/><rect x="1" y="4" width="7" height="7" rx="1"/></svg>
    </div>
  </header>
  <div class="app">
    <main class="workspace">
      <section aria-labelledby="query-title">
        <div class="section-heading">
          <div class="query">
            <h2 id="query-title">后台查询</h2>
            <p id="query-summary">在专用 Edge 中登录并查询。</p>
          </div>
          <button class="button primary" id="open-browser"><span>打开后台</span></button>
        </div>
        <div class="sender-selection" role="group" aria-labelledby="sender-label">
          <span id="sender-label">导出内容</span>
          <label><input id="sender-visitor" type="checkbox" value="visitor" data-sender>用户</label>
          <label><input id="sender-agent" type="checkbox" value="agent" data-sender>客服</label>
          <label><input id="sender-bot" type="checkbox" value="bot" data-sender>机器人</label>
        </div>
      </section>
      <section class="progress-section" aria-label="导出任务">
        <div class="progress-heading" id="progress-heading" hidden>
          <div class="status-caption"><span class="status-dot" id="task-dot" aria-hidden="true"></span><h2 id="task-label" role="status"></h2></div>
          <span id="progress-fraction"></span>
        </div>
        <p id="task-message" role="status"></p>
        <div id="progress-details" hidden>
          <div class="progress-track" role="progressbar" aria-label="已处理会话" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
          <dl class="counts">
            <div><dt>成功</dt><dd id="count-success">—</dd></div>
            <div><dt>部分成功</dt><dd id="count-partial">—</dd></div>
            <div><dt>失败</dt><dd id="count-failed">—</dd></div>
          </dl>
        </div>
        <div class="export-actions">
          <button class="button primary" id="start-export" disabled>开始导出</button>
          <button class="button secondary" id="stop-export" hidden disabled>停止并保留进度</button>
        </div>
        <p id="action-feedback" role="alert"></p>
      </section>
      <section class="result-section" aria-labelledby="result-label">
        <div class="file-description">
          <h2 id="result-label">Excel 保存位置</h2>
          <p id="output-dir" hidden></p>
          <p id="result-path" hidden></p>
        </div>
        <div class="file-actions">
          <button class="button secondary" id="select-output">选择文件夹</button>
          <button class="button quiet" id="change-output" hidden>更换位置</button>
          <button class="button quiet" id="open-folder" hidden>打开文件夹</button>
          <button class="button secondary" id="open-file" hidden>打开 Excel</button>
        </div>
      </section>
    </main>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-heading">
      <h2 id="settings-title">设置</h2>
      <button class="button quiet" id="close-settings" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <section class="settings-row">
      <div><h3>未完成任务</h3><p>清除进度后，下次从头采集。</p></div>
      <button class="button secondary" id="clear-jobs">清除任务</button>
    </section>
    <section class="settings-row">
      <div><h3>专用登录状态</h3><p>关闭专用 Edge 后可清除。</p></div>
      <button class="button secondary" id="clear-login">清除登录</button>
    </section>
    <p id="settings-feedback" role="status"></p>
  </dialog>
</body>
</html>
